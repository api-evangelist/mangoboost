description: >-
  First-party MangoBoost distribution artifacts. MangoBoost publishes one public
  package-registry artifact (the llmboost_hub Python CLI on PyPI) and one public Helm
  chart repository (llmboost, for Kubernetes deployment). Everything else — the LLMBoost
  container image and the Mango SDK .deb/.rpm packages — is distributed through a
  MangoBoost-provisioned container registry or by contacting the company directly, so
  those are recorded as gated rather than public.


x-coverage:
  state: covered
  reason: no-machine-readable-spec
  detail: >-
    Fully profiled from three live, server-rendered documentation hosts, but MangoBoost
    publishes no machine-readable contract for any of its three API surfaces — /openapi.json,
    /openapi.yaml, /swagger.json, /api-docs and /redoc all return 404 on www., sdk. and
    llmboost.mangoboost.io, and the OPI gRPC bridge ships no first-party .proto. The
    LLMBoost server is OpenAI-compatible, so an OpenAPI describing its /v1 surface would be
    cheap for them to publish.
  evidence:
    - url: https://llmboost.mangoboost.io/docs/features/openai-api
      status: 200
    - url: https://sdk.mangoboost.io/docs/api/
      status: 200

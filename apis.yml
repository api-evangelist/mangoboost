aid: mangoboost
name: MangoBoost
description: 'MangoBoost, Inc. builds full-stack Data Processing Unit (DPU) hardware
  and AI-infrastructure software for data centers. Founded in 2022 and headquartered
  in Seattle with operations in Canada and Korea, the company ships the Mango BoostX
  DPU family (RoCE AI / RDMA, NVMe-oF initiator and target, TCP Offload Engine), the
  Mango SDK — a C/C++ device library (libmango), CLI tools (mango-ctl, mango-smi) and
  an OPI-compliant gRPC storage bridge — and Mango LLMBoost, an enterprise LLM inference
  server that exposes a drop-in OpenAI-compatible REST API on customer-owned AMD Instinct
  GPUs. Its developer surface is self-hosted rather than SaaS: the LLMBoost server is
  distributed as a container plus the llmboost_hub (lbh) Python CLI, and the DPU is
  programmed through libmango and OPI gRPC on the card.'

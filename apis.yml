- aid: mangoboost:opi-storage-bridge
  name: Mango OPI Storage Bridge gRPC API
  description: 'MangoBoost ships an Open Programmable Infrastructure (OPI) gRPC bridge
    that translates standard OPI storage API calls into MangoBoost SDK / SPDK RPC calls
    on the DPU, so NVMe-oF initiator (NTI) and target (NTT) offloads can be configured
    with the vendor-neutral OPI interface. The bridge listens on gRPC port 50051 with an
    HTTP gateway on 8082; documented calls include CreateNvmeSubsystem, CreateNvmeController,
    CreateNvmeRemoteController, CreateNvmePath and CreateNvmeNamespace. The implementation
    is open source under the Linux Foundation OPI project as opi-mangoboost-bridge.'
  humanURL: https://sdk.mangoboost.io/docs/guide/docs_opi/overview
  x-deployment: on-device-grpc
  x-default-port: 50051

- aid: mangoboost:mango-sdk
  name: Mango SDK Device API (libmango)
  description: 'The Mango SDK development package (libmango-dev) provides the C/C++ user
    API, libraries and example applications for programming MangoBoost DPU devices.
    Documented API groups are Common, Device Context, Memory, DMA Transfer, TCP/IP Offload,
    TLS Offload, POSIX (compatibility shims), AI Image Preprocess, GPU StorageBoost (GSB),
    RDMA PCC and Software-Defined Device. Applications include libmango.h and link with
    pkg-config; packages are distributed as .deb/.rpm (mango-sdk, mango-cli, libmango-dev,
    mango-drivers, mango-drivers-spdk) obtained by contacting MangoBoost.'
  humanURL: https://sdk.mangoboost.io/docs/api/

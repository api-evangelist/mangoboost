    conforms: true
    scope: Mango LLMBoost Inference Server
    evidence: >-
      "LLMBoost serves the OpenAI REST API on /v1. If your app already talks to OpenAI,
      migration is a one-line base-URL change — no SDK swap, no rewrite." Documented
      endpoints: /v1/chat/completions, /v1/completions, /v1/embeddings, /v1/responses,
      /v1/audio/transcriptions, /v1/audio/translations, /v1/models.
    url: https://llmboost.mangoboost.io/docs/features/openai-api

